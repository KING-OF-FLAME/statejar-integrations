name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hook script parses as Python 3.8 (the oldest the plugin supports)
        run: python -c "import ast,sys; ast.parse(open(sys.argv[1]).read(), feature_version=(3, 8))" plugins/statejar/scripts/statejar_hook.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Hermes Agent, for loading the memory provider with Hermes's own discovery
        run: |
          python -m venv /tmp/hermes
          /tmp/hermes/bin/pip install -q "hermes-agent==0.19.0"
      - name: Tests (a stand-in StateJar API; no network, no secrets; the OpenCode plugin runs in Node)
        env:
          HERMES_PYTHON: python3
        run: |
          pip install "pytest>=8,<9"
          python -m pytest -q tests/
      - name: Claude Code validates the plugin and the marketplace
        run: |
          npm install -g @anthropic-ai/claude-code > /dev/null
          claude plugin validate ./plugins/statejar
          claude plugin validate .
      - name: Codex installs the plugin and finds its MCP server, hooks and skills (no model, no StateJar)
        run: |
          npm install -g @openai/codex@0.163.0 > /dev/null
          python e2e/codex_discovery.py --codex "$(command -v codex)"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: OpenClaw installs the plugin, `openclaw statejar init` selects it, and it loads as the memory slot
        run: |
          npm install -g openclaw@2026.10.5 > /dev/null
          python e2e/openclaw_discovery.py --openclaw "$(command -v openclaw)"

  secrets:
    # every commit, not only the latest: a key removed later is still in history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No secret in any commit (gitleaks 8.30.1, checksum-verified)
        run: |
          v=8.30.1
          curl -sSfL -o "$RUNNER_TEMP/gl.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
