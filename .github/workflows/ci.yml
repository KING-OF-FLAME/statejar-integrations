name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hook script on Python 3.8 syntax
        run: python -m py_compile claude-code/scripts/statejar_hook.py
      - name: Tests (a stand-in StateJar API; no network, no secrets)
        run: |
          pip install "pytest>=8,<9"
          python -m pytest -q tests/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claude Code validates the plugin and the marketplace
        run: |
          npm install -g @anthropic-ai/claude-code > /dev/null
          claude plugin validate ./claude-code
          claude plugin validate .
