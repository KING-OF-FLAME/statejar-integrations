name: hermes-validate
on:
  push:
    branches: [main]
    paths: ["hermes/**", ".github/workflows/hermes-validate.yml"]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to validate (default: the selected ref)"
        required: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # hermes-agent main gates every dependency on python_version >= 3.14
      - name: Commit under validation
        run: git rev-parse HEAD
      # `hermes plugins validate` is not in hermes-agent 0.19.0 on PyPI (its `plugins` subcommands stop at
      # install/update/remove/list/enable/disable); it is in NousResearch/hermes-agent's main, which the catalog's own
      # CI uses. So install that commit, pinned.
      # hermes-agent main refuses wheel builds (its setup.py guard: "Building wheels or sdists for hermes-agent is
      # not supported"); its own catalog CI runs from a checkout, so clone the pinned commit and install it editable.
      - name: Install Hermes Agent (main at a pinned commit, editable)
        env:
          HERMES_REF: 5057eaa3a4d0cbef0e30078418a5115faa62889e
        run: |
          git clone -q --filter=blob:none https://github.com/NousResearch/hermes-agent /tmp/hermes-src
          git -C /tmp/hermes-src checkout -q --detach "$HERMES_REF"
          git -C /tmp/hermes-src rev-parse HEAD
          # its dependencies are exact pins resolved by uv from its uv.lock; pip cannot resolve them
          python -m pip install -q "uv==0.13.5"   # the uv Hermes pins in pm/lock.json
          (cd /tmp/hermes-src && UV_PROJECT_ENVIRONMENT=/tmp/hermes uv sync --frozen --no-dev -q)
          /tmp/hermes/bin/hermes plugins --help | head -20
      - name: hermes plugins validate
        run: /tmp/hermes/bin/hermes plugins validate --install-deps hermes/statejar
