# The entry for the Hermes plugin catalog: one file, plugin-catalog/statejar.yaml, in NousResearch/hermes-agent.
# Schema: plugin-catalog/README.md in that repository (read 2026-10-30). `sha` pins the commit the catalog installs;
# set it to the commit of this repository's main that holds the release you want listed, then run
#   hermes plugins validate <checkout>/hermes/statejar --install-deps
# before opening the PR. `capabilities` must match what the plugin registers at that commit, or validation fails.
name: statejar
repo: https://github.com/KING-OF-FLAME/statejar-integrations
sha: e48f8b79d6f14b876ae106f3fbc195a16305bf5c
subdir: hermes/statejar
description: "Verifiable memory for Hermes Agent: typed facts, content-addressed versions, recall of only what a message needs, and an audit trail."
maintainer: StateJar
tier: community
category: memory
requires_hermes: ">=0.19"
docs_url: https://statejar.com/docs/hermes
version: "0.1.0"
title: StateJar
readme: true
capabilities:
  provides_tools: [statejar_search, statejar_remember, statejar_forget, statejar_list]
  provides_hooks: [on_session_end, on_pre_compress, on_memory_write, on_session_switch]
  provides_middleware: []
  requires_env: [STATEJAR_API_KEY]
